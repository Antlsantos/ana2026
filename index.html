<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Vôlei Score</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Bebas+Neue&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Setup Screen -->
  <div id="setupScreen" class="screen active">
    <div class="setup-container">
      <div class="setup-logo">
        <div class="logo-icon">V</div>
        <h1 class="logo-title">Vôlei Score</h1>
        <p class="logo-sub">Placar em tempo real</p>
      </div>

      <div class="setup-card">
        <div class="field">
          <label class="field-label">Time A</label>
          <input type="text" id="teamAInput" class="field-input" placeholder="Nome do time" maxlength="20">
        </div>

        <div class="vs-divider"><span>VS</span></div>

        <div class="field">
          <label class="field-label">Time B</label>
          <input type="text" id="teamBInput" class="field-input" placeholder="Nome do time" maxlength="20">
        </div>

        <button id="startBtn" class="btn-primary">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          Iniciar Jogo
        </button>
      </div>
    </div>
  </div>

  <!-- Game Screen -->
  <div id="gameScreen" class="screen">
    <header class="topbar">
      <h1 class="topbar-title">Vôlei Score</h1>
      <div class="topbar-actions">
        <button id="toggleServeBtn" class="btn-icon" title="Trocar saque">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 17.58A5 5 0 0 0 18 8h-1.26A8 8 0 1 0 4 16.25"/><path d="m8 16 4-4-4-4"/><path d="M16 16l-4-4 4-4"/></svg>
        </button>
        <button id="resetBtn" class="btn-icon" title="Reiniciar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
      </div>
    </header>

    <main class="main-content">
      <!-- Match Header -->
      <div id="matchHeader" class="match-header">
        <span id="setsA" class="set-count team-a-color">0</span>
        <span class="set-label">Set <span id="currentSetLabel">1</span></span>
        <span id="setsB" class="set-count team-b-color">0</span>
      </div>

      <!-- Tiebreak -->
      <div id="tiebreakBadge" class="tiebreak-badge hidden">Tie-Break · 15 pontos</div>

      <!-- Scoreboard -->
      <div class="scoreboard">
        <!-- Team A -->
        <div class="team team-a">
          <div class="team-info">
            <h2 id="teamAName" class="team-name team-a-color truncate">Time A</h2>
            <div id="serveA" class="serve-dot team-a-bg team-a-glow hidden"></div>
          </div>
          <div class="set-dots" id="setDotsA">
            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
          </div>
          <div class="score-box team-a-bg-subtle team-a-border">
            <span id="scoreA" class="score-number team-a-color">0</span>
          </div>
          <div class="controls">
            <button class="btn-ctrl" data-team="A" data-action="sub">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14"/></svg>
            </button>
            <button class="btn-ctrl btn-add team-a-btn" data-team="A" data-action="add">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </div>
        </div>

        <div class="scoreboard-x">×</div>

        <!-- Team B -->
        <div class="team team-b">
          <div class="team-info">
            <h2 id="teamBName" class="team-name team-b-color truncate">Time B</h2>
            <div id="serveB" class="serve-dot team-b-bg team-b-glow hidden"></div>
          </div>
          <div class="set-dots" id="setDotsB">
            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
          </div>
          <div class="score-box team-b-bg-subtle team-b-border">
            <span id="scoreB" class="score-number team-b-color">0</span>
          </div>
          <div class="controls">
            <button class="btn-ctrl" data-team="B" data-action="sub">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14"/></svg>
            </button>
            <button class="btn-ctrl btn-add team-b-btn" data-team="B" data-action="add">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </div>
        </div>
      </div>

      <p id="pointInfo" class="point-info">25 pontos para vencer o set · Diferença mínima de 2</p>

      <!-- Set History -->
      <div id="setHistory" class="set-history hidden">
        <h3 class="history-title">Histórico de Sets</h3>
        <div class="history-table-wrap">
          <table class="history-table">
            <thead>
              <tr>
                <th>Set</th>
                <th id="historyColA" class="team-a-color">Time A</th>
                <th id="historyColB" class="team-b-color">Time B</th>
              </tr>
            </thead>
            <tbody id="historyBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Winner Overlay -->
  <div id="winnerOverlay" class="overlay hidden">
    <div class="winner-card">
      <div class="trophy-icon">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 22V8c0-1.1.9-2 2-2s2 .9 2 2v14"/><path d="M6 9v4a6 6 0 0 0 12 0V9"/></svg>
      </div>
      <p class="winner-label">Vencedor</p>
      <h2 id="winnerName" class="winner-name"></h2>
      <div class="winner-actions">
        <button id="newMatchBtn" class="btn-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          Nova Partida
        </button>
        <button id="goHomeBtn" class="btn-outline">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Início
        </button>
      </div>
    </div>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <script src="script.js"></script>
</body>
</html>
